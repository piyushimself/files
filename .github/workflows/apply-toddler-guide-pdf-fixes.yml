name: Apply and verify toddler-guide PDF layout fixes

on:
  push:
    branches:
      - source-pdf-corrections-clean
    paths:
      - tools/correct_source_pdfs.py
      - .github/workflows/apply-toddler-guide-pdf-fixes.yml

permissions:
  contents: write

jobs:
  correct-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the correction branch
        uses: actions/checkout@v4
        with:
          ref: source-pdf-corrections-clean
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF tooling
        run: python -m pip install --upgrade pymupdf
      - name: Apply idempotent source-PDF corrections
        run: python tools/correct_source_pdfs.py
      - name: Render corrected toddler-guide pages
        run: |
          mkdir -p toddler-guide-visual-review
          python - <<'PY'
          import fitz
          from pathlib import Path
          for filename in ("Three_Year_Old_Reading_Guide (1).pdf", "World_Stories_3YearOld_Guide.pdf"):
              doc = fitz.open(filename)
              page = doc[14]
              page.get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False).save(
                  Path("toddler-guide-visual-review") / (filename.replace(" ", "_").replace(".pdf", "-page-15.png"))
              )
              doc.close()
          PY
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: toddler-guide-pdf-layout-fixes
          path: toddler-guide-visual-review/
          if-no-files-found: error
      - name: Commit only the two reviewed PDF corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Three_Year_Old_Reading_Guide (1).pdf" "World_Stories_3YearOld_Guide.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "Fix toddler guide page 15 number badges and glyphs"
          git push origin HEAD:source-pdf-corrections-clean
