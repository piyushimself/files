name: Build and deploy Reading Room

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reading-room-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR engine
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get install -y tesseract-ocr tesseract-ocr-hin
          fi
          tesseract --version
      - name: Build safe site
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python tools/build.py
      - name: Validate generated app scripts
        run: python tools/validate_site.py
      - name: Validate Pine Script safety invariants
        run: python tools/validate_pine_static.py
      - name: Validate corrected source PDF findings
        run: python tools/validate_source_pdf_corrections.py
      - name: Extract redacted source documents for review
        continue-on-error: true
        run: python tools/document_review_extract.py
      - name: Upload temporary redacted document review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-room-document-review-redacted
          path: |
            document-review-redacted/summary.md
            document-review-redacted/manifest.json
            document-review-redacted/README.txt
            document-review-redacted/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Upload temporary source PDFs for visual review
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: reading-room-source-pdfs-visual-review
          path: "*.pdf"
          if-no-files-found: error
          retention-days: 1
      - name: Install Chromium test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real-browser QA at desktop and mobile sizes
        run: |
          python -m http.server 4173 --directory site > /tmp/reading-room-http.log 2>&1 &
          python tools/browser_qa.py
      - name: Upload browser QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-room-browser-qa
          path: |
            browser-qa-report/
            site/data/catalog.json
            PUBLISHING-REVIEW.md
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
