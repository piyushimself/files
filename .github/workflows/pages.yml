name: Build and deploy Reading Room

on:
  push:
    branches: [main, site-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR engine
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get install -y tesseract-ocr tesseract-ocr-hin
          fi
          tesseract --version
      - name: Build safe site
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python tools/build.py
      - name: Validate generated app scripts
        run: python tools/validate_site.py
      - name: Install Chromium test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real-browser QA at desktop and mobile sizes
        run: |
          python -m http.server 4173 --directory site > /tmp/reading-room-http.log 2>&1 &
          python tools/browser_qa.py
      - name: Upload browser QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-room-browser-qa
          path: browser-qa-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
