name: Temporary source PDF corrections
on:
  push:
    branches: [source-pdf-corrections]
    paths:
      - 'tools/correct_source_pdfs.py'
      - 'tools/manifest_movie_ratings_647.py'
      - '.github/workflows/apply-source-pdf-corrections.yml'
jobs:
  correct:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-pdf-corrections
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PDF tooling
        run: python -m pip install PyMuPDF==1.26.7
      - name: Apply visually reviewed source corrections
        run: python tools/correct_source_pdfs.py
      - name: Build the 647-row deduplication manifest
        run: python tools/manifest_movie_ratings_647.py complete_movie_ratings_647.pdf --csv FILM-RATINGS-647-MANIFEST.csv --json FILM-RATINGS-647-AUDIT.json
      - name: Commit corrected PDFs and audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.pdf FILM-RATINGS-647-MANIFEST.csv FILM-RATINGS-647-AUDIT.json
          if git diff --cached --quiet; then
            echo "No source PDF or manifest changes to commit."
          else
            git commit -m "Apply reviewed PDF corrections and add film deduplication manifest"
            git push origin source-pdf-corrections
          fi
      - name: Upload corrected source PDFs and manifest
        uses: actions/upload-artifact@v4
        with:
          name: reading-room-corrected-source-pdfs
          path: |
            *.pdf
            FILM-RATINGS-647-MANIFEST.csv
            FILM-RATINGS-647-AUDIT.json
          if-no-files-found: error
          retention-days: 1
