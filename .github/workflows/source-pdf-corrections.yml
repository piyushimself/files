name: Temporary source PDF corrections

on:
  push:
    branches: [source-pdf-corrections]
    paths:
      - ".github/workflows/source-pdf-corrections.yml"
      - "tools/correct_source_pdfs.py"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF editing dependency
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Apply reviewed PDF corrections
        run: python tools/correct_source_pdfs.py
      - name: Upload corrected PDFs for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: reading-room-corrected-source-pdfs
          path: |
            masters_of_e_art_cinema.pdf
            sensitive_cinema.pdf
            definitive_anime_encyclopedia.pdf
            ultimate_anime_guide.pdf
            complete_movie_ratings.pdf
            complete_movie_encyclopedia.pdf
            Cybersecurity_Stories_For_Your_Teams.pdf
          if-no-files-found: error
          retention-days: 1
      - name: Commit corrected PDFs to this review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add masters_of_e_art_cinema.pdf sensitive_cinema.pdf definitive_anime_encyclopedia.pdf ultimate_anime_guide.pdf complete_movie_ratings.pdf complete_movie_encyclopedia.pdf Cybersecurity_Stories_For_Your_Teams.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes produced."
          else
            git commit -m "Correct high-confidence source PDF findings [skip ci]"
            git push origin HEAD:source-pdf-corrections
          fi
